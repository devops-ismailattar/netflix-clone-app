name: API GATEWAY CICD FOR NODE JS APP
on:
    push:
        branches: ["main"]

jobs:
    checkout:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v6.0.1
            
            - name: setup Nodejs
              uses: actions/setup-node@v6.2.0
              with:
                node-version: 24

            - name: build application
              run: npm install

            - name: sonarqube scan
              uses: SonarSource/sonarqube-scan-action@v7.0.0
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            - name: SonarQube Quality Gate Check
              uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
              id: sonarqube-quality-gate-check
              with:
                pollingTimeoutSec: 600
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            - name: Upload a Build Artifact
              uses: actions/upload-artifact@v6.0.0
              with:
                name: app-artifact
                path: ./package*json

    build-and-push-docker-image:
        runs-on: ubuntu-latest
        needs: checkout
        steps:
            - name: code checkout
              uses: actions/checkout@v6.0.1

            - name: Download a Build Artifact
              uses: actions/download-artifact@v7.0.0
              with:
                name: app-artifact
                path: ./
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ap-south-1
            
            - name: login to ECR
              uses: docker/login-action@v3
              with:
                registry: 076226033208.dkr.ecr.ap-south-1.amazonaws.com

            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v3.12.0

            - name: Build and push Docker images
              uses: docker/build-push-action@v6.18.0
              with: 
                push: true
                tag: 076226033208.dkr.ecr.ap-south-1.amazonaws.com/netflix-app:${{ github.sha }}
                    

    update-deployment-files:
        runs-on: ubuntu-latest
        needs: build-and-push-docker-image
        permissions:
            contents: write
        steps:
            - name: code checkout
              uses: actions/checkout@v6.0.1
              with:
                token: ${{ github.token }}

            - name: update deployment files
              run: |
                git config user.name ismail
                git config user.email ismail.attar@gmail.com
                sed -i "s|image:.*|image: 076226033208.dkr.ecr.ap-south-1.amazonaws.com/netflix-app:${{ github.sha }}|" app-manifest/deployment.yaml
                git add .
                git commit -m  "updated deployment files to ${{ github.sha }}" || echo "No changes to commit"
                git push origin main
                git fetch origin
                git checkout argocd
                sed -i "s|image:.*|image: 076226033208.dkr.ecr.ap-south-1.amazonaws.com/netflix-app:${{ github.sha }}|" app-manifest/deployment.yaml
                git add .
                git commit -m  "updated deployment files to ${{ github.sha }}" || echo "No changes to commit"
                git push origin argocd






            


